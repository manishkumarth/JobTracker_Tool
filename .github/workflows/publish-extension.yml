
name: Publish Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - "extension/**"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Validate manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const manifestPath = 'extension/manifest.json';
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

          console.log('Name:', m.name);
          console.log('Version:', m.version);

          if (m.manifest_version !== 3) {
            throw new Error('Expected Manifest V3');
          }

          for (const p of [
            'background.service_worker',
            'action.default_popup'
          ]) {
            const value = p.split('.').reduce((o, k) => o?.[k], m);
            if (!value) {
              throw new Error('Missing manifest field: ' + p);
            }
          }

          const files = [
            'background.js',
            'popup.html',
            'content.js',
            'content.css',
            'icons/icon-16.png',
            'icons/icon-48.png',
            'icons/icon-128.png'
          ];

          for (const f of files) {
            if (!fs.existsSync('extension/' + f)) {
              throw new Error('Missing extension file: ' + f);
            }
          }

          console.log('Manifest and referenced files look valid.');
          NODE

      - name: Build extension ZIP
        shell: bash
        run: |
          cd extension
          zip -r ../jobtrackr-extension.zip . \
            -x "*.DS_Store" \
            -x "icons/generate-icons.mjs"

      - name: Validate ZIP
        shell: bash
        run: |
          unzip -t jobtrackr-extension.zip

          echo "ZIP root files:"
          unzip -Z1 jobtrackr-extension.zip | head -40

          echo "Packaged manifest:"
          unzip -p jobtrackr-extension.zip manifest.json

          if ! unzip -Z1 jobtrackr-extension.zip | grep -qx "manifest.json"; then
            echo "ERROR: manifest.json must be at the ZIP root."
            exit 1
          fi

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        shell: bash
        run: |
          test -n "$EXTENSION_ID" || {
            echo "Missing CHROME_EXTENSION_ID secret"
            exit 1
          }

          test -n "$CLIENT_ID" || {
            echo "Missing CHROME_CLIENT_ID secret"
            exit 1
          }

          test -n "$CLIENT_SECRET" || {
            echo "Missing CHROME_CLIENT_SECRET secret"
            exit 1
          }

          test -n "$REFRESH_TOKEN" || {
            echo "Missing CHROME_REFRESH_TOKEN secret"
            exit 1
          }

          test -n "$PUBLISHER_ID" || {
            echo "Missing CHROME_PUBLISHER_ID secret"
            exit 1
          }

          chrome-webstore-upload upload \
            --source jobtrackr-extension.zip \
            --extension-id "$EXTENSION_ID" \
            --publisher-id "$PUBLISHER_ID"

      - name: Summary
        if: success()
        run: |
          echo "Chrome Web Store upload completed successfully."
          echo "Check the Developer Dashboard for processing and publishing status."
