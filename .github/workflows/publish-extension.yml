
name: Publish Chrome Extension

on:
  push:
    branches:
      - main
    paths:
      - "extension/**"
      - ".github/workflows/publish-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Chrome Web Store CLI
        run: npm install -g chrome-webstore-upload-cli

      - name: Read extension version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build extension ZIP
        shell: bash
        run: |
          cd extension
          zip -r ../jobtrackr-extension.zip . \
            -x "*.DS_Store" \
            -x "icons/generate-icons.mjs"

      - name: Upload to Chrome Web Store
        env:
          EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
        shell: bash
        run: |
          test -n "$EXTENSION_ID" || { echo "Missing CHROME_EXTENSION_ID secret"; exit 1; }
          test -n "$CLIENT_ID" || { echo "Missing CHROME_CLIENT_ID secret"; exit 1; }
          test -n "$CLIENT_SECRET" || { echo "Missing CHROME_CLIENT_SECRET secret"; exit 1; }
          test -n "$REFRESH_TOKEN" || { echo "Missing CHROME_REFRESH_TOKEN secret"; exit 1; }
          test -n "$PUBLISHER_ID" || { echo "Missing CHROME_PUBLISHER_ID secret"; exit 1; }

          chrome-webstore-upload upload \
            --source jobtrackr-extension.zip \
            --extension-id "$EXTENSION_ID"

      - name: Summary
        run: |
          echo "Uploaded extension version ${{ steps.version.outputs.version }}"
